name: Prepare Laravel source
on:
  push:
    paths:
      - .github/workflows/prepare-source.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source files
        run: |
          unzip -o project-source.zip
          rm project-source.zip .github/workflows/prepare-source.yml
          git config user.name "Lexxxx12"
          git config user.email "Lexxxx12@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete Laravel project with migrations, seed data and tests"
          git push
